name: Sync upstream source and releases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM: gylive/ccodex-sleep-state
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Merge the upstream default branch and sync tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/$UPSTREAM.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/$UPSTREAM.git"
          git fetch --prune --tags upstream
          git merge --no-edit upstream/main
          git push origin HEAD:main
          git push origin --tags

      - name: Mirror upstream release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream-releases"

          mapfile -t tags < <(
            gh api --paginate "repos/$UPSTREAM/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' | tac
          )

          for tag in "${tags[@]}"; do
            upstream_json="$RUNNER_TEMP/upstream-releases/$tag.upstream.json"
            fork_json="$RUNNER_TEMP/upstream-releases/$tag.fork.json"
            gh api "repos/$UPSTREAM/releases/tags/$tag" > "$upstream_json"

            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$fork_json" 2>/dev/null; then
              upstream_state=$(jq -cS '{name, body, prerelease, assets: [.assets[] | {name, size, digest}] | sort_by(.name)}' "$upstream_json")
              fork_state=$(jq -cS '{name, body, prerelease, assets: [.assets[] | {name, size, digest}] | sort_by(.name)}' "$fork_json")
              if [[ "$upstream_state" == "$fork_state" ]]; then
                echo "$tag is already synchronized"
                continue
              fi
            fi

            release_dir="$RUNNER_TEMP/upstream-releases/$tag"
            rm -rf "$release_dir"
            mkdir -p "$release_dir"
            gh release download "$tag" --repo "$UPSTREAM" --dir "$release_dir"

            if [[ ! -f "$release_dir/SHA256SUMS" ]]; then
              echo "$tag has no SHA256SUMS file; refusing to publish unverified assets" >&2
              exit 1
            fi
            (cd "$release_dir" && sha256sum -c SHA256SUMS)

            if [[ -s "$fork_json" ]]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi

            title=$(jq -r '.name // .tag_name' "$upstream_json")
            notes_file="$RUNNER_TEMP/upstream-releases/$tag.notes.md"
            jq -r '.body // ""' "$upstream_json" > "$notes_file"
            args=(
              release create "$tag"
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "$title"
              --notes-file "$notes_file"
            )
            if [[ $(jq -r '.prerelease' "$upstream_json") == true ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}" "$release_dir"/*
          done
